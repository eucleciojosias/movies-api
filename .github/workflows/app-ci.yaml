name: App CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ECR_REPOSITORY: movies-py-api

jobs:
  build:
    name: Lint, build, scan, push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff format --check
        run: uv run ruff format --check app

      - name: ruff check
        run: uv run ruff check app

      - name: Derive the image tag from the commit
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >>"$GITHUB_ENV"
          echo "Image tag: ${GITHUB_SHA::7}"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          remote="${REGISTRY}/${ECR_REPOSITORY}"
          docker tag "${ECR_REPOSITORY}:${IMAGE_TAG}" "${remote}:${IMAGE_TAG}"
          docker push "${remote}:${IMAGE_TAG}"

  deploy:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: k8s-deploy-staging
      cancel-in-progress: false
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check the staging cluster exists
        id: cluster
        run: |
          if out=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" \
                     --query 'cluster.status' --output text 2>&1); then
            echo "Cluster status: $out"
            [ "$out" = "ACTIVE" ] && echo "deploy=true" >>"$GITHUB_OUTPUT" \
              || echo "::notice::skipping deploy: cluster is $out, not ACTIVE"
          else
            echo "::notice::skipping deploy: $out"
          fi

      - uses: azure/setup-helm@v4
        if: steps.cluster.outputs.deploy == 'true'
        with:
          version: v4.2.0

      - name: Update kubeconfig
        if: steps.cluster.outputs.deploy == 'true'
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME"

      - name: Deploy movies-api
        if: steps.cluster.outputs.deploy == 'true'
        run: |
          helm upgrade --install movies-api ./chart \
            --namespace default \
            --set image.repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}" \
            --set image.tag="${GITHUB_SHA::7}" \
            --rollback-on-failure \
            --timeout 2m
